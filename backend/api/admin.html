<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonalex admin</title>
<style>
  :root {
    --bg: #0b0910; --panel: #16131f; --panel-2: #1b1727; --panel2: #221d31; --line: #2a2540; --text: #f4f2fa; --dim: #9a93b0;
    --accent: #7c5cff; --accent2: #b078ff; --ok: #3ccf8e; --warn: #ffb547; --bad: #ff5c7a;
    --grad: linear-gradient(135deg, #8b6bff 0%, #b078ff 100%);
    --radius: 18px; --shadow: 0 18px 40px -22px rgba(0,0,0,.75); --shadow-sm: 0 4px 14px -8px rgba(0,0,0,.55);
    --glow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 8px 26px -10px color-mix(in srgb, var(--accent) 55%, transparent);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f3fb; --panel: #ffffff; --panel-2: #faf9fe; --panel2: #efedf8; --line: #e6e3f2; --text: #16131f; --dim: #716b88;
      --shadow: 0 18px 40px -24px rgba(60,40,120,.28); --shadow-sm: 0 4px 14px -8px rgba(60,40,120,.2); color-scheme: light; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh;
    background:
      radial-gradient(1100px 620px at 82% -8%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      radial-gradient(900px 520px at 8% 4%, color-mix(in srgb, var(--accent2) 16%, transparent), transparent 55%),
      var(--bg);
    background-attachment: fixed; }
  ::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--dim) 35%, transparent); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--dim) 55%, transparent); background-clip: padding-box; }
  header { display: flex; align-items: center; gap: 14px; padding: 16px 28px; position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: saturate(160%) blur(16px);
    border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent); }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--grad); display: grid; place-items: center; color: #fff; font-size: 21px; flex: none;
    box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--accent) 70%, transparent), inset 0 1px 0 rgba(255,255,255,.3); }
  header h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  header .sub { color: var(--dim); font-size: 13px; }
  header .spacer { flex: 1; }
  main { max-width: 1280px; margin: 0 auto; padding: 26px 28px 70px; }
  h2 { display: flex; align-items: center; gap: 10px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 650; margin: 34px 2px 14px; }
  h2::before { content: ""; width: 4px; height: 15px; border-radius: 3px; background: var(--grad); }
  .grid { display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); }
  .card { position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 17px 19px; box-shadow: var(--shadow-sm); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .stat .label { color: var(--dim); font-size: 12.5px; font-weight: 550; letter-spacing: .02em; text-transform: uppercase; }
  .stat .value { font-size: 30px; font-weight: 750; margin-top: 5px; letter-spacing: -.02em; line-height: 1.1; }
  .stat .hint { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
  .bar { height: 10px; border-radius: 8px; background: color-mix(in srgb, var(--panel2) 80%, transparent); overflow: hidden; display: flex; gap: 2px; margin-top: 12px; padding: 0; }
  .bar span { display: block; height: 100%; border-radius: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 550; background: color-mix(in srgb, var(--panel2) 70%, transparent); color: var(--dim); border: 1px solid var(--line); }
  .badge.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 11px; padding: 9px 15px; cursor: pointer; background: color-mix(in srgb, var(--panel2) 85%, transparent); color: var(--text); transition: transform .12s ease, filter .15s ease, background .15s ease, box-shadow .15s ease; }
  button:hover { transform: translateY(-1px); filter: brightness(1.08); }
  button:active { transform: translateY(0); }
  button:focus-visible { outline: none; box-shadow: var(--glow); }
  button.primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
  button.danger { background: color-mix(in srgb, var(--bad) 16%, transparent); border-color: color-mix(in srgb, var(--bad) 35%, transparent); color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; transform: none; filter: none; }
  .requests .card { display: flex; align-items: center; gap: 14px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 4px 12px -5px rgba(0,0,0,.5); }
  .user { cursor: pointer; }
  .user:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: var(--shadow); }
  .user .top { display: flex; gap: 12px; align-items: center; }
  .user .name { font-weight: 680; font-size: 16px; display: flex; align-items: center; gap: 7px; }
  .user .meta { color: var(--dim); font-size: 12.5px; margin-top: 1px; }
  .user .row { display: flex; justify-content: space-between; gap: 10px; margin-top: 11px; padding-top: 11px; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); font-size: 13px; color: var(--dim); }
  .user .row:first-of-type { border-top: 0; }
  .user .row b { color: var(--text); font-weight: 650; text-align: right; }
  .now { margin-top: 12px; font-size: 12.5px; font-weight: 550; color: var(--accent2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed { display: flex; flex-direction: column; gap: 1px; padding: 6px; }
  .play { display: flex; gap: 13px; align-items: center; padding: 9px 11px; border-radius: 12px; transition: background .15s ease; }
  .play:hover { background: color-mix(in srgb, var(--panel2) 75%, transparent); }
  .art { width: 42px; height: 42px; border-radius: 9px; background: var(--panel2); object-fit: cover; flex: none; box-shadow: 0 3px 10px -5px rgba(0,0,0,.6); }
  .play .t { flex: 1; min-width: 0; }
  .play .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .play .t > div:first-child { font-weight: 550; }
  .play .t .a { color: var(--dim); font-size: 13px; font-weight: 400; }
  .play .w { color: var(--dim); font-size: 12px; text-align: right; flex: none; line-height: 1.35; }
  .empty { color: var(--dim); padding: 16px 6px; font-size: 14px; }
  dialog { border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(180deg, var(--panel-2), var(--panel)); color: var(--text); width: min(920px, 94vw); max-height: 88vh; padding: 0; box-shadow: var(--shadow); }
  dialog[open] { animation: pop .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  dialog::backdrop { background: color-mix(in srgb, #06040c 60%, transparent); backdrop-filter: blur(6px); }
  .dlg { padding: 24px 26px 28px; overflow: auto; max-height: 88vh; }
  .dlg header { position: static; padding: 0 0 16px; border: 0; background: none; backdrop-filter: none; }
  .dlg .card { background: color-mix(in srgb, var(--panel2) 45%, transparent); box-shadow: none; }
  .cols { display: grid; gap: 15px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } main, header { padding-left: 16px; padding-right: 16px; } header { gap: 10px; } .grid { gap: 12px; } }
  svg text { fill: var(--dim); font-size: 10px; }
  .login { max-width: 380px; margin: 14vh auto; box-shadow: var(--shadow); padding: 28px 28px 26px; }
  .login h1 { letter-spacing: -.01em; }
  .login input { width: 100%; padding: 13px 15px; border-radius: 13px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel2) 60%, transparent); color: var(--text); font: inherit; margin-top: 12px; transition: border-color .15s ease, box-shadow .15s ease; }
  .login input:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: var(--glow); }
  .login button { width: 100%; margin-top: 18px; padding: 13px; font-size: 15px; }
  .err { color: var(--bad); font-size: 13px; margin-top: 11px; min-height: 18px; text-align: center; }
  ol.top { margin: 6px 0 0; padding-left: 22px; } ol.top li { margin: 7px 0; } ol.top li::marker { color: var(--accent2); font-weight: 700; } ol.top span { color: var(--dim); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const BASE = location.pathname.replace(/\/admin\/?$/, "");
const COLORS = ["#7c5cff", "#ff5c9e", "#3ccf8e", "#ffb547", "#4cc3ff", "#b078ff", "#ff7a59", "#5ce0d0"];
let token = localStorage.getItem("sonalex.admin.token");
let state = {};

const $ = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const bytes = (n) => { if (!n) return "0 B"; const u = ["B", "KB", "MB", "GB", "TB"]; const i = Math.min(4, Math.floor(Math.log(n) / Math.log(1024))); return (n / 1024 ** i).toFixed(i > 1 ? 1 : 0) + " " + u[i]; };
const minutes = (m) => m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
const ago = (t) => { if (!t) return "never"; const s = Date.now() / 1000 - t; if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)} min ago`; if (s < 86400) return `${Math.floor(s / 3600)} h ago`; return `${Math.floor(s / 86400)} d ago`; };
const color = (name) => COLORS[[...String(name)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const avatar = (name, size = 42) => `<div class="avatar" style="width:${size}px;height:${size}px;background:${color(name)}">${esc(String(name)[0] || "?").toUpperCase()}</div>`;
const art = (s) => s && s.artId ? `/Items/${encodeURIComponent(s.artId)}/Images/Primary?fillWidth=96&fillHeight=96${s.artTag ? "&tag=" + s.artTag : ""}` : (s && s.art) || "";
const provider = (p) => ({ spotify: "Spotify", deezer: "Deezer", none: "No service" }[p] || p || "");

async function api(path, options = {}) {
  const r = await fetch(BASE + path, { ...options, headers: { "Content-Type": "application/json", ...(token ? { Authorization: `MediaBrowser Token="${token}"` } : {}) } });
  if (r.status === 401 || r.status === 403) { if (!path.endsWith("/login")) { logout(); } }
  if (!r.ok) { let d = ""; try { d = (await r.json()).detail; } catch {} throw new Error(d || `Error ${r.status}`); }
  return r.status === 204 ? null : r.json();
}

function logout() { token = null; localStorage.removeItem("sonalex.admin.token"); renderLogin(); }

function renderLogin(error = "") {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const box = $(`<form class="login card" autocomplete="on">
      <div style="display:flex;gap:12px;align-items:center"><div class="logo">♫</div><div><h1 style="margin:0;font-size:20px">Sonalex admin</h1><div class="sub" style="color:var(--dim)">Sign in with your Jellyfin administrator account</div></div></div>
      <input id="u" name="username" type="text" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"><input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="primary" id="go" type="submit">Sign In</button><div class="err">${esc(error)}</div></form>`);
  app.append(box);
  const go = async () => {
    const btn = box.querySelector("#go"); btn.disabled = true;
    try {
      const r = await api("/api/admin/login", { method: "POST", body: JSON.stringify({ username: box.querySelector("#u").value, password: box.querySelector("#p").value }) });
      token = r.token; localStorage.setItem("sonalex.admin.token", token); load();
    } catch (e) { renderLogin(e.message); }
  };
  box.addEventListener("submit", (e) => { e.preventDefault(); go(); });
}

async function load() {
  try {
    const [overview, users, requests, activity] = await Promise.all([api("/api/admin/overview"), api("/api/admin/users"), api("/api/admin/requests"), api("/api/admin/activity")]);
    state = { overview, users: users.users, requests: requests.requests, plays: activity.plays };
    render();
  } catch (e) { if (token) console.error(e); }
}

function render() {
  const { overview: o, users, requests, plays } = state;
  const app = document.getElementById("app");
  const m = o.music, d = o.disk;
  const pct = (x) => (100 * x / d.total).toFixed(2) + "%";
  app.innerHTML = "";
  app.append($(`<header><div class="logo">♫</div><div><h1>${esc(o.jellyfin.name || "Sonalex")}</h1><div class="sub">Jellyfin ${esc(o.jellyfin.version || "?")} · up ${Math.floor(o.uptime / 86400)} d ${Math.floor(o.uptime % 86400 / 3600)} h</div></div>
      <div class="spacer"></div>
      ${Object.entries({ "Several users": o.modules.multiUser, "Sign-ups": o.modules.signups, "Online catalog": o.modules.online, "Spotify / Deezer sync": o.modules.spotifySync }).map(([k, v]) => `<span class="badge ${v ? "on" : ""}">${v ? "●" : "○"} ${k}</span>`).join(" ")}
      <button onclick="logout()">Sign Out</button></header>`));
  const main = $(`<main></main>`);
  app.append(main);

  if (!o.modules.multiUser) {
    main.append($(`<div class="card" style="border-color:var(--warn)"><b>One step left for several users:</b> create an API key in Jellyfin (Dashboard → API Keys → +, name it “Sonalex server”), put it in <code>backend/.env</code> as <code>JELLYFIN_API_KEY=…</code>, then restart the server (<code>systemctl --user restart sonalex-server</code>).</div>`));
  }

  main.append($(`<h2>Server</h2>`));
  const free = d.free, music = m.realBytes, other = d.used - music - o.cacheBytes;
  main.append($(`<div class="grid">
    <div class="card stat" style="grid-column: span 2"><div class="label">Storage</div><div class="value">${bytes(free)} <span style="font-size:15px;color:var(--dim);font-weight:500">free of ${bytes(d.total)}</span></div>
      <div class="bar"><span style="width:${pct(music)};background:var(--accent)"></span><span style="width:${pct(o.cacheBytes)};background:var(--accent2)"></span><span style="width:${pct(Math.max(0, other))};background:#5b5670"></span></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Music ${bytes(music)}</span><span><i style="background:var(--accent2)"></i>Cache ${bytes(o.cacheBytes)}</span><span><i style="background:#5b5670"></i>System ${bytes(Math.max(0, other))}</span><span><i style="background:var(--panel2)"></i>Free ${bytes(free)}</span></div></div>
    <div class="card stat"><div class="label">Saved by sharing</div><div class="value">${bytes(m.savedBytes)}</div><div class="hint">${m.files} files for ${bytes(m.logicalBytes)} of libraries</div></div>
    <div class="card stat"><div class="label">Users</div><div class="value">${o.users}</div><div class="hint">${o.pending ? `<span style="color:var(--warn)">${o.pending} waiting</span>` : "no request waiting"}</div></div>
    <div class="card stat"><div class="label">Memory</div><div class="value">${bytes(o.memory.total - o.memory.available)}</div><div class="hint">of ${bytes(o.memory.total)}</div></div>
    <div class="card stat"><div class="label">CPU</div><div class="value">${o.temperature ? o.temperature.toFixed(0) + " °C" : "—"}</div><div class="hint">load ${o.load.map((x) => x.toFixed(2)).join(" · ")}</div></div>
    <div class="card stat"><div class="label">Listened today</div><div class="value">${minutes(Object.values(o.today).reduce((a, b) => a + b, 0))}</div><div class="hint">${Object.keys(o.today).length} listening</div></div>
  </div>`));

  main.append($(`<h2>Access requests</h2>`));
  if (!requests.length) main.append($(`<div class="empty">No request waiting. New users sign up from the app (“Create an account”).</div>`));
  const req = $(`<div class="grid requests"></div>`);
  for (const r of requests) {
    const card = $(`<div class="card">${avatar(r.name)}<div style="flex:1"><div style="font-weight:650">${esc(r.name)}</div><div class="meta" style="color:var(--dim);font-size:12.5px">${provider(r.provider)}${r.deezer ? " · " + esc(r.deezer.name) : ""} · ${ago(r.createdAt)}</div></div>
      <button class="primary">Accept</button><button class="danger">Refuse</button></div>`);
    const [ok, no] = card.querySelectorAll("button");
    ok.onclick = async () => { ok.disabled = no.disabled = true; try { await api(`/api/admin/requests/${r.id}/approve`, { method: "POST" }); load(); } catch (e) { alert(e.message); ok.disabled = no.disabled = false; } };
    no.onclick = async () => { if (!confirm(`Refuse ${r.name}?`)) return; ok.disabled = no.disabled = true; await api(`/api/admin/requests/${r.id}/deny`, { method: "POST" }); load(); };
    req.append(card);
  }
  main.append(req);

  main.append($(`<h2>Users</h2>`));
  const grid = $(`<div class="grid"></div>`);
  for (const u of users.sort((a, b) => b.weekMinutes - a.weekMinutes)) {
    const card = $(`<div class="card user"><div class="top">${avatar(u.name)}<div><div class="name">${esc(u.name)} ${u.admin ? '<span class="badge">owner</span>' : ""}</div><div class="meta">${provider(u.provider)}${u.deezerName ? " · " + esc(u.deezerName) : ""}${u.syncing ? " · syncing…" : ""}</div></div></div>
      <div class="row"><span>Songs</span><b>${u.songs}</b></div>
      <div class="row"><span>Room (own · shared)</span><b>${bytes(u.ownBytes)} · ${bytes(u.sharedBytes)}</b></div>
      <div class="row"><span>This week · month</span><b>${minutes(u.weekMinutes)} · ${minutes(u.monthMinutes)}</b></div>
      <div class="row"><span>Last song</span><b>${ago(u.lastPlayed)}</b></div>
      ${u.nowPlaying ? `<div class="now">▶ ${esc(u.nowPlaying.title)} — ${esc(u.nowPlaying.artist)}</div>` : ""}</div>`);
    card.onclick = () => openUser(u);
    grid.append(card);
  }
  main.append(grid);

  main.append($(`<h2>Latest songs</h2>`));
  const feed = $(`<div class="card feed"></div>`);
  if (!plays.length) feed.append($(`<div class="empty">Nothing yet: the apps report every song they play.</div>`));
  for (const p of plays.slice(0, 40)) {
    feed.append($(`<div class="play"><img class="art" src="${esc(art(p))}" onerror="this.style.visibility='hidden'" alt=""><div class="t"><div>${esc(p.title)}</div><div class="a">${esc(p.artist)}</div></div><div class="w">${avatar(p.user, 22).replace('class="avatar"', 'class="avatar" style="display:inline-grid;vertical-align:middle;font-size:11px"')} ${esc(p.user)}<br>${ago(p.at)}</div></div>`));
  }
  main.append(feed);
}

let _gradN = 0;
function bars(values, labels, height = 120) {
  const w = 100 / values.length, max = Math.max(1, ...values);
  const gid = "bg" + (_gradN++);
  const rects = values.map((v, i) => {
    const h = (v / max) * (height / 4 - 4);
    return `<rect x="${i * w + w * 0.14}" y="${height / 4 - h}" width="${w * 0.72}" height="${Math.max(h, 0.5)}" rx="0.7" fill="url(#${gid})" opacity="${v ? 1 : 0.22}"><title>${labels[i]}: ${minutes(v)}</title></rect>`;
  }).join("");
  return `<svg viewBox="0 0 100 ${height / 4 + 8}" preserveAspectRatio="none" style="width:100%;height:${height}px;margin-top:8px;overflow:visible">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>${rects}</svg>`;
}

async function openUser(u) {
  const p = await api(`/api/admin/users/${u.id}`);
  const s = p.stats;
  const days = s.byDay.map((_, i) => { const d = new Date(Date.now() - (13 - i) * 86400000); return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" }); });
  const dlg = $(`<dialog><div class="dlg">
    <header><div style="display:flex;gap:14px;align-items:center">${avatar(p.name, 54)}<div><h1 style="font-size:22px;margin:0">${esc(p.name)}</h1><div class="sub" style="color:var(--dim)">${provider(p.provider)} · joined ${p.joinedAt ? new Date(p.joinedAt * 1000).toLocaleDateString() : "—"}</div></div></div><div class="spacer"></div>
      ${p.provider === "spotify" || p.provider === "deezer" ? '<button id="sync">Sync now</button>' : ""}${!u.admin ? '<button class="danger" id="del">Remove</button>' : ""}<button id="close">Close</button></header>
    <div class="grid">
      <div class="card stat"><div class="label">Listened (all time)</div><div class="value">${minutes(s.minutes)}</div><div class="hint">${s.plays} songs</div></div>
      <div class="card stat"><div class="label">Last 30 days</div><div class="value">${minutes(s.periodMinutes)}</div><div class="hint">${s.periodPlays} songs</div></div>
      <div class="card stat"><div class="label">Library</div><div class="value">${p.library}</div><div class="hint">${p.favorites} favorites</div></div>
      ${p.moment ? `<div class="card stat"><div class="label">Song of the moment</div><div style="font-weight:650;margin-top:6px">${esc(p.moment.title)}</div><div class="hint">${esc(p.moment.artist)}</div></div>` : ""}
    </div>
    <div class="cols" style="margin-top:14px">
      <div class="card"><div class="label" style="color:var(--dim)">Minutes per day (14 days)</div>${bars(s.byDay, days)}</div>
      <div class="card"><div class="label" style="color:var(--dim)">When (30 days, by hour)</div>${bars(s.byHour, s.byHour.map((_, h) => h + " h"))}<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim)"><span>0 h</span><span>6 h</span><span>12 h</span><span>18 h</span><span>23 h</span></div></div>
      <div class="card"><div class="label" style="color:var(--dim)">Top songs</div><ol class="top">${s.topSongs.map((t) => `<li>${esc(t.title)} <span>— ${esc(t.artist)} · ${t.plays}×</span></li>`).join("") || '<div class="empty">—</div>'}</ol></div>
      <div class="card"><div class="label" style="color:var(--dim)">Top artists</div><ol class="top">${s.topArtists.map((a) => `<li>${esc(a.name)} <span>· ${a.plays}×</span></li>`).join("") || '<div class="empty">—</div>'}</ol></div>
    </div>
    <h2>Latest songs</h2><div class="feed">${s.recent.map((r) => `<div class="play"><img class="art" src="${esc(art(r))}" onerror="this.style.visibility='hidden'" alt=""><div class="t"><div>${esc(r.title)}</div><div class="a">${esc(r.artist)}</div></div><div class="w">${ago(r.at)}</div></div>`).join("") || '<div class="empty">—</div>'}</div>
  </div></dialog>`);
  document.body.append(dlg);
  dlg.querySelector("#close").onclick = () => dlg.close();
  dlg.addEventListener("close", () => dlg.remove());
  const sync = dlg.querySelector("#sync");
  if (sync) sync.onclick = async () => { sync.disabled = true; await api(`/api/admin/users/${u.id}/sync`, { method: "POST" }); sync.textContent = "Syncing…"; };
  const del = dlg.querySelector("#del");
  if (del) del.onclick = async () => {
    if (!confirm(`Remove ${p.name}? Their account, library and playlists are deleted (songs other users have stay).`)) return;
    await api(`/api/admin/users/${u.id}`, { method: "DELETE" }); dlg.close(); load();
  };
  dlg.showModal();
}

if (token) { load(); } else { renderLogin(); }
setInterval(() => token && !document.querySelector("dialog[open]") && load(), 30000);
</script>
</body>
</html>
